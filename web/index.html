<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The headline and the lede fonts, fetched alongside the script instead of after it renders. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2"
    />
    <meta
      name="description"
      content="Your food delivery history, told in orders."
    />
    <title>Munch · Your orders, a little closer</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('munch-theme') || 'auto';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
